# ══════════════════════════════════════════════════════════════════════════════
# BTP Plant — Freezing Simulation Configuration
# ══════════════════════════════════════════════════════════════════════════════

plant: btp

# ── Study window ──────────────────────────────────────────────────────────────
start_date: 2026-05-01            # first simulated day (matches May_BTP_Requirement)
simulation_days: 31               # May has 31 days (full-month freezing run)
planning_days: 31                 # LP horizon per daily run — matches the BTP LP's native Config.PLANNING_DAYS (31)
shift_start_hour: 7

# ── Demand input ──────────────────────────────────────────────────────────────
demand_file: inputs/btp/May_BTP_Requirement.xlsx
base_demand_sheet: Base demand
revision_sheets:
  - day: 11
    sheet: 1st iterative demand (day 11)
  - day: 21
    sheet: 2nd iterative demand on day 21

# ── Day-1 mould state (LP-ready format, exported from BTP DB on setup) ────────
day1_moulds_file: inputs/btp/daily_moulds_pcr_2026-05-01.csv
target_mould_life: 3000

# ── Tail-consolidation policy (moulds_manager.roll) ──────────────────────────
# When a press's running SKU finishes, instead of force-mounting the highest-
# priority compatible unmet SKU (the old "never idle" rule), only re-assign a
# freed press to a SKU that still needs more presses to finish its remaining
# demand within the study horizon. Presses left over are dropped (left idle).
consolidation_enabled: true                  # false → restore old "never idle" behaviour
consolidation_single_press_threshold: 1200   # remaining demand below this ⇒ 1 press suffices
consolidation_slack: 1                  # headroom factor on the min-presses formula (1.0 = zero cushion; 0.9 = ~10% cushion)

# ── Actuals simulator ─────────────────────────────────────────────────────────
actuals_low_pct: -0.05
actuals_high_pct: 0.02
random_seed: 42

# ── LP wrapper ────────────────────────────────────────────────────────────────
tyre_type: pcr
lp_module_path: ../jk-btp-lp-scheduler-main

# ── Output ────────────────────────────────────────────────────────────────────
final_report_name: final_kpi_report.xlsx
